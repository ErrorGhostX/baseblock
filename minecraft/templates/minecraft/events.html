{% extends 'base.html' %}

{% block content %}
<div class="events-container py-8 bg-gray-900 min-h-screen">
    <!-- Заголовок и кнопка создания ивента -->
    <div class="header-container flex justify-between items-center mb-6 px-4">
        <h1 class="text-3xl font-bold text-white">Ивенты</h1>
        <a href="{% url 'create_event' %}" class="create-event-btn bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded-lg shadow-lg transition">Создать ивент</a>
    </div>

    <!-- Список ивентов -->
    <div class="events-list space-y-6 px-4">
        {% for event in events %}
            <div class="event-card bg-gray-800 p-6 rounded-lg shadow-lg text-white">
                <h2 class="text-2xl font-semibold mb-2">{{ event.title }}</h2>
                <p class="text-gray-300 mb-4">{{ event.description }}</p>
                <p class="mb-4">
                    <strong>Дата:</strong> {{ event.date }}
                    <strong>Время:</strong> {{ event.time }}
                </p>
                <button>
                    <a href="{% url 'event_detail' event.id %}" class="text-purple-400 hover:text-purple-600">Подробнее</a>
                </button>
                

            </div>
        {% empty %}
            <p class="text-white">Ивентов нет.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
