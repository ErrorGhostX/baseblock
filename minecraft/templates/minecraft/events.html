{% extends 'base.html' %}

{% block content %}
<div class="events-container py-8 bg-gray-900 bg-opacity-90 max-w-6xl mx-auto p-6 rounded-lg shadow-lg">
    <!-- Заголовок и кнопка создания ивента -->
    <div class="header-container flex flex-col lg:flex-row justify-between items-center mb-6 px-4">
        <h1 class="text-3xl font-bold text-white">Ивенты</h1>
        <a href="{% url 'create_event' %}" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded-lg shadow-lg transition">Создать ивент</a>
    </div>
<!-- Список ивентов -->
<section class="">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for event in events %}
        <a href="{% url 'event_detail' event.id %}" class="news-item block bg-gray-700 p-4 rounded-lg shadow hover:shadow-lg transition-transform transform hover:scale-105 hover:bg-gray-800">
            <h2 class="text-2xl font-semibold mb-2 text-purple-200">{{ event.title }}</h2>
            <p class="text-gray-300 text-sm mb-4">{{ event.description|slice:":40" }}</p>
            <p class="text-gray-300">
                <strong>Дата:</strong> {{ event.date }} |
                <strong>Время:</strong> {{ event.time }}
            </p>
            {% if event.image1 %}
            <img src="{{ event.image1.url }}" alt="Image" class="w-full h-40 object-cover rounded mb-4">
            {% endif %}
        </a>
        {% empty %}
        <p class="text-white">Ивентов нет.</p>
        {% endfor %}
    </div>
</section>

</div>
{% endblock %}
