{% extends 'base.html' %}

{% block content %}
<div class="py-8 bg-gray-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-center text-white mb-6">Все игроки</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for user in users %}
            <div class="bg-gray-800 p-6 shadow-lg">
                <div class="flex flex-col items-center">
                    <img src="{{ user.profile_image.url }}" alt="{{ user.username }}'s Avatar" class="w-32 h-32 object-cover mb-4">
                    <h2 class="text-xl font-semibold text-white">{{ user.username }}</h2>
                    <p class="text-sm text-gray-400">{{ user.get_full_name }}</p>
                    <p class="mt-4 text-sm text-gray-300">{{ user.description }}</p>
                    <div class="mt-4">
                        <a href="{% url 'profile' user.username %}" class="inline-block bg-purple-600 hover:bg-purple-700 text-white py-2 px-6 rounded-lg shadow-md transition">
                            Перейти в профиль
                        </a>
                    </div>
                </div>
            </div>
            {% empty %}
                <p class="text-white text-center col-span-full">Нет игроков на сайте.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
