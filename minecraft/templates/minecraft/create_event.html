{% extends 'base.html' %}

{% block content %}
<div class="create-event-container max-w-6xl mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <div class="max-w-3xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-white mb-8 text-center">Создать новый ивент</h1>

        <form method="POST" enctype="multipart/form-data" class=" p-6 rounded-lg shadow-lg">
            {% csrf_token %}
            <div class="space-y-6">
                <!-- Поля формы -->
                {% for field in form %}
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between sm:space-x-4">
                    <label for="{{ field.id_for_label }}" class="block text-white font-semibold mb-2 sm:mb-0 sm:w-1/3">
                        {{ field.label_tag }}
                    </label>
                    <div class="sm:w-2/3">
                        {{ field }}
                        {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors|join:" " }}</p>
                        {% endif %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="mt-6 text-center">
                <button type="submit" class="submit-btn inline-block bg-purple-600 hover:bg-purple-700 text-white py-2 px-6 rounded-lg shadow-md transition">
                    Создать ивент
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
