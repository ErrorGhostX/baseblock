{% extends 'base.html' %}

{% block content %}
<div class="create-event-container py-8 bg-gray-900 min-h-screen">
    <div class="max-w-3xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-white mb-8">Создать новый ивент</h1>

        <form method="POST" enctype="multipart/form-data" class="bg-gray-800 p-6 rounded-lg shadow-lg">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <div class="mt-6">
                <button type="submit" class="submit-btn inline-block bg-purple-600 hover:bg-purple-700 text-white py-2 px-6 rounded-lg shadow-md transition">
                    Создать ивент
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
