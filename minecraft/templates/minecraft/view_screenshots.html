{% extends 'base.html' %}

{% block content %}
<div class="screenshots-container py-8 bg-gray-900 bg-opacity-90 p-6 rounded-lg shadow-lg">
    <!-- Заголовок -->
    <div class="header-container flex flex-col lg:flex-row justify-between items-center mb-6 px-4">
        <h1 class="text-3xl font-bold text-white">Скриншоты игроков</h1>
        
        <form method="post" enctype="multipart/form-data" class="flex flex-col space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded-lg shadow-lg transition">Загрузить</button>
        </form>


    </div>
<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
    {% for screenshot in screenshots %}
    <div class="screenshot-item block bg-gray-700 rounded-lg shadow hover:shadow-lg transition-transform transform hover:scale-105 hover:bg-gray-800 p-4">
        <img src="{{ screenshot.image.url }}" alt="Скриншот" class="w-full h-full object-cover rounded mb-4">
        <div class="text-container">
            <p class="text-gray-400 text-sm mb-2">Игрок: {{ screenshot.user.username }}</p>
            <p class="text-gray-400 text-xs">Загружено: {{ screenshot.uploaded_at|date:"d.m.Y H:i" }}</p>
        </div>
    </div>
    {% empty %}
    <p class="text-white">Скриншоты отсутствуют.</p>
    {% endfor %}
</section>


        </div>
{% endblock %}
