{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-lg mx-auto bg-gray-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl text-center text-purple-300 mb-6">Регистрация</h1>

    <form method="post">
        {% csrf_token %}
        
        <!-- Отображение каждого поля формы -->
        {% for field in form %}
            <div class="mb-4">
                <label for="{{ field.id_for_label }}" class="block text-sm text-purple-300 mb-2">{{ field.label }}</label>
                <div class="input-wrapper">
                    <!-- Добавим классы для стилизации поля -->
                    {{ field }}
                </div>

                <!-- Если у поля есть ошибки, они будут отображаться ниже -->
                {% if field.errors %}
                    <div class="text-sm text-red-500 mt-2">
                        {% for error in field.errors %}
                            <p class="error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <!-- Кнопка отправки формы -->
        <button type="submit" class="w-full bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded-lg shadow-md">
            Зарегистрироваться
        </button>
    </form>
</div>
{% endblock %}
