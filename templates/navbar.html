
{% load static %}

<nav class="items-center justify-between p-8 h-50">



        <!-- Логотип -->
        <div class="logo flex lg:justify-center items-center">
            <img src="{% static 'minecraft/images/baseblock.png' %}" alt="Логотип проекта" class="w-40p">
        </div>


        
        <div class="fixed z-10 items-center top-5 right-2 grid grid-cols-[3rem_3rem] grid-rows-[3rem] gap-2">
            <!-- Аватар -->
            {% if user.is_authenticated %}
            <a href="{% url 'profile' user.username %}" class="flex items-center justify-center rounded-lg border border-purple-800  h-full overflow-hidden">
                <img src="{{ profile_image }}" alt="Аватар" class="w-full">
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="flex items-center justify-center rounded-lg border border-purple-800  h-full overflow-hidden">
             <img src="{% static 'minecraft/images/noavatar.svg' %}" alt="Discord" class="h-8 w-8">
            </a>
            {% endif %}




        <!-- Бургер-меню -->

        <div class="relative text-white h-full">
            <button id="menu-toggle" class="flex rounded-lg justify-center items-center w-full h-full bg-purple-600  cursor-pointer hover:bg-purple-700 focus:outline-none">
                <img src="{% static 'minecraft/images/compass.svg' %}" alt="Discord" class="h-full w-full">
            </button>
             <!-- Скрытое меню -->
            <ul id="menu" class="absolute right-0 top-16 bg-purple-900 text-white shadow-lg rounded-lg w-48 hidden flex-col space-y-2 p-4">
                <li>
                    <a href="{% url 'home' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Новости
                        <img src="{% static 'minecraft/images/paper.svg' %}" alt="Новости" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'about' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        О сервере
                        <img src="{% static 'minecraft/images/book-normal.svg' %}" alt="О сервере" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'rules' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Правила
                        <img src="{% static 'minecraft/images/book-written.svg' %}" alt="Правила" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'events' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Ивенты
                        <img src="{% static 'minecraft/images/book-writable.svg' %}" alt="Ивенты" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'map' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Карта
                        <img src="{% static 'minecraft/images/map-filled.svg' %}" alt="Карта" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'contacts' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Контакты
                        <img src="{% static 'minecraft/images/sign.svg' %}" alt="Контакты" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'view_screenshots' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Скриншоты
                        <img src="{% static 'minecraft/images/painting.svg' %}" alt="Скриншоты" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'download_mods_page' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Моды
                        <img src="{% static 'minecraft/images/minecart-command-block.svg' %}" alt="Моды" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'donate' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Донат
                        <img src="{% static 'minecraft/images/ruby.svg' %}" alt="Донат" class="ml-2 w-8 h-8">
                    </a>
                </li>
                <li>
                    <a href="{% url 'user_list' %}" class="flex items-center justify-between hover:text-purple-300 transition hover:scale-110">
                        Игроки
                    </a>
                </li>
                {% if user.is_authenticated %}
                    <li><a href="{% url 'profile' user.username %}" class="block hover:text-purple-300 transition hover:scale-110">Профиль</a></li>
                {% else %}
                    <li><a href="{% url 'login' %}" class="block hover:text-purple-300 transition hover:scale-110">Войти</a></li>
                {% endif %}
            </ul>

        </div>


        <script>

        document.getElementById('menu-toggle').addEventListener('click', function () {
            const menu = document.getElementById('menu');
            menu.classList.toggle('hidden');
        });
    </script>
    </div>
</nav>
